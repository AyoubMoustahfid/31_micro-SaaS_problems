
spring:
  application:
    name: challenge-platform

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/challenge_platform}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: platform
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 60MB

  flyway:
    enabled: true
    schemas: platform
    default-schema: platform
    create-schemas: true
    locations:
      - classpath:db/migration
      - classpath:db/migration-history

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

  storage:
    root: ${FILE_STORAGE_PATH:./private-uploads}

  upload:
    max-files: 10
    max-file-size: 20971520
    max-total-size: 52428800
    allowed-extension: csv
    queue-poll-ms: 5000
    job-lease-seconds: 1800

  antivirus:
    executable: ${CLAMAV_EXECUTABLE:C:/Program Files/ClamAV/clamscan.exe}
    database-directory: ${CLAMAV_DATABASE_DIRECTORY:${user.home}/.clamav/database}
    timeout-seconds: 60
